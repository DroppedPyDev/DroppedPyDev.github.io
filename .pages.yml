# Pages CMS configuration: https://pagescms.org
media: media
content:
  - name: site
    label: Website content
    type: file
    path: content.json
    format: json
    fields:
      - { name: name, label: Your name, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: status, label: Status badge (leave empty to hide), type: string }
      - { name: intro, label: Intro, type: text }
      - { name: about, label: About, type: text }
      - { name: email, label: Email, type: string }
      - name: design
        label: Design and look
        type: object
        fields:
          - { name: theme, label: Default theme, type: select, options: { values: [auto, light, dark] } }
          - { name: layout, label: Layout (sidebar or top bar), type: select, options: { values: [sidebar, top] } }
          - { name: align, label: Text alignment, type: select, options: { values: [left, center] } }
          - { name: font, label: Font style, type: select, options: { values: [editorial, modern, mono] } }
          - { name: accent, label: Accent colour (hex, for example #2f5bff), type: string }
          - { name: colors, label: Background glow colours (3 hex values), type: string, list: true }
          - { name: blur, label: Glass blur (0 to 40), type: number, options: { min: 0, max: 40 } }
          - { name: roundness, label: Corner roundness (0 to 36), type: number, options: { min: 0, max: 36 } }
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: year, label: Year, type: string }
          - { name: desc, label: Description, type: text }
          - { name: tags, label: Tags, type: string, list: true }
          - { name: url, label: Link, type: string }
      - name: posts
        label: Blog posts
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: date, label: Date, type: date }
          - { name: summary, label: Summary, type: text }
          - { name: body, label: Body (plain text, blank line between paragraphs), type: text }
      - name: resume
        label: Resume
        type: object
        fields:
          - { name: pdf, label: PDF file name (for example resume.pdf), type: string }
          - name: experience
            label: Experience
            type: object
            list: true
            fields:
              - { name: role, label: Role, type: string }
              - { name: org, label: Company, type: string }
              - { name: when, label: Dates, type: string }
              - { name: points, label: Highlights, type: string, list: true }
          - name: education
            label: Education
            type: object
            list: true
            fields:
              - { name: what, label: Degree and institution, type: string }
              - { name: when, label: Dates, type: string }
          - { name: skills, label: Skills, type: string, list: true }
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - { name: label, label: Name, type: string }
          - { name: note, label: Short note, type: string }
          - { name: url, label: URL, type: string }
